name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run tests
        run: dotnet test WetFlow.sln -c Release --logger "console;verbosity=minimal"

      - name: Publish
        run: dotnet publish src/WetFlow.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Create ZIP
        run: Compress-Archive -Path publish\* -DestinationPath "WetFlow-${{ github.ref_name }}-win-x64.zip"

      - name: Create GitHub Release
        run: gh release create "${{ github.ref_name }}" "WetFlow-${{ github.ref_name }}-win-x64.zip" --generate-notes --title "WetFlow ${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ github.token }}
